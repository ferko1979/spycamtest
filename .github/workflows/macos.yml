name: macos-build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build macOS app (unsigned by default)
        run: |
          chmod +x ./build-macos.sh
          ./build-macos.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpyCam-Agent-dmg
          path: build/macos/*.dmg

      - name: Upload APP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpyCam-Agent-app
          path: build/macos/*.app