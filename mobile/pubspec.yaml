name: spycam_mobile
description: SpyCam — network & camera scanner with licensed features (iOS/Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cryptography: ^2.7.0          # Ed25519 signature verification
  shared_preferences: ^2.2.0    # persist server URL, codes, device id
  network_info_plus: ^5.0.0     # local IP / subnet discovery
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
